name: Build

# Builds OpenMCL for Windows, macOS and Linux. Push a tag like v0.1.0 to get
# a GitHub Release with the binaries attached; otherwise the builds are
# downloadable from the run's Artifacts section.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: OpenMCL-windows
            binary: dist/OpenMCL.exe
          - os: macos-latest
            artifact: OpenMCL-macos
            binary: dist/OpenMCL.app
          - os: ubuntu-latest
            artifact: OpenMCL-linux
            binary: dist/OpenMCL
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: python -m PyInstaller openmcl.spec --noconfirm --version-file packaging/version_info.txt

      - name: Build (macOS and Linux)
        if: runner.os != 'Windows'
        run: python -m PyInstaller openmcl.spec --noconfirm

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: dist/OpenMCL.exe --version

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: ./dist/OpenMCL.app/Contents/MacOS/OpenMCL --version

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
          QT_QPA_PLATFORM=offscreen ./dist/OpenMCL --selftest

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/OpenMCL.app dist/OpenMCL-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/OpenMCL.exe
            dist/OpenMCL
            dist/OpenMCL-macos.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
