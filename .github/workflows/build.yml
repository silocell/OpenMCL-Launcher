name: Build

# Builds the three distributable packages:
#   Windows  OpenMCL.exe                 single-file executable
#   macOS    OpenMCL.dmg                 drag-to-Applications disk image
#   Linux    OpenMCL-x86_64.AppImage     portable, runs on most distributions
#
# Push a tag like v0.1.0 to publish them as a GitHub Release; otherwise they
# are downloadable from the run's Artifacts section.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: QT_QPA_PLATFORM=offscreen python -m pytest tests/ -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: python -m PyInstaller openmcl.spec --noconfirm
      - name: Smoke test
        run: dist/OpenMCL.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMCL-windows
          path: dist/OpenMCL.exe
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: python -m PyInstaller openmcl.spec --noconfirm
      - name: Smoke test
        run: ./dist/OpenMCL.app/Contents/MacOS/OpenMCL --version
      - name: Build disk image
        run: bash packaging/make_dmg.sh
      - name: Verify disk image mounts and holds the app
        run: |
          hdiutil attach dist/OpenMCL.dmg -mountpoint /tmp/openmcl-dmg -nobrowse
          test -d /tmp/openmcl-dmg/OpenMCL.app
          test -L /tmp/openmcl-dmg/Applications
          hdiutil detach /tmp/openmcl-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMCL-macos
          path: dist/OpenMCL.dmg
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libfuse2
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build AppImage
        run: bash packaging/make_appimage.sh
      - name: Smoke test
        run: |
          QT_QPA_PLATFORM=offscreen ./dist/OpenMCL-x86_64.AppImage --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: OpenMCL-linux
          path: dist/OpenMCL-x86_64.AppImage
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required to publish build provenance, which lets anyone verify a
      # download was produced by this workflow from this source.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the downloads
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ ";"
          ls -lh release

      - name: Write checksums
        working-directory: release
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/OpenMCL.exe
            release/OpenMCL.dmg
            release/OpenMCL-x86_64.AppImage

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Windows 10+ | `OpenMCL.exe` |
            | macOS 11+ | `OpenMCL.dmg` |
            | Linux 64-bit | `OpenMCL-x86_64.AppImage` |

            **Windows will say "Windows protected your PC".** The build isn't
            code-signed. Choose **More info**, then **Run anyway**.
            [Why this happens.](https://silocell.github.io/OpenMCL-Launcher/#first-run)

            **macOS will refuse to open it.** Right-click the app and choose
            **Open**, then **Open** again.

            ### Verifying your download

            Every file is listed in `SHA256SUMS`, and each one carries a build
            attestation proving it was produced by this repository's public
            workflow. Check one with the GitHub CLI:

            ```
            gh attestation verify OpenMCL.exe --repo silocell/OpenMCL-Launcher
            ```

            You need a Microsoft account that owns Minecraft: Java Edition.
            [Sign-in setup.](https://github.com/silocell/OpenMCL-Launcher#set-up-sign-in)
