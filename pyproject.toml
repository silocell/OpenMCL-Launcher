[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmcl"
dynamic = ["version"]
description = "A Minecraft launcher with Modrinth, CurseForge and Microsoft account support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
openmcl = "openmcl.ui.app:main"

[tool.setuptools.dynamic]
version = {attr = "openmcl.__version__"}

[tool.setuptools.packages.find]
include = ["openmcl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
